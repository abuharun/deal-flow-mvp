# Local development only. These credentials exist solely for the developer
# machine; production uses Render-managed Postgres and env vars.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bevosita
      POSTGRES_USER: bevosita
      POSTGRES_PASSWORD: bevosita
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevosita -d bevosita"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
