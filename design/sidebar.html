<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:220px;align-self:stretch;flex:none;background:#f5f0e0;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;padding:20px 12px;gap:2px;font-family:Inter,sans-serif;box-sizing:border-box;color:#0a0a0a">
<div style="display:flex;align-items:center;gap:10px;padding:4px 10px 14px">
<div style="width:30px;height:30px;border-radius:9px;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px">B</div>
<div style="display:flex;flex-direction:column"><span style="font-weight:600;font-size:15px;letter-spacing:-0.3px">Bvosita</span><span style="font-size:11px;color:#6a6a6a">bvosita.uz</span></div>
</div>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="10">
<sc-if value="{{ it.hasHead }}" hint-placeholder-val="{{ false }}"><div style="font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#9a9a9a;padding:14px 10px 4px">{{ it.head }}</div></sc-if>
<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:{{ it.bg }};font-size:13.5px;font-weight:{{ it.fw }};color:{{ it.fg }}">
<span style="width:13px;height:13px;border-radius:4px;border:1.5px solid {{ it.fg }};flex:none"></span>
<span style="flex:1">{{ it.label }}</span>
<sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:#0a0a0a;color:#fff">{{ it.badge }}</span></sc-if>
</div>
</sc-for>
<div style="margin-top:auto;padding:14px 10px 0;border-top:1px solid #e5e5e5;display:flex;align-items:center;gap:10px">
<div style="width:26px;height:26px;border-radius:50%;background:#ebe6d6"></div>
<div style="display:flex;flex-direction:column;font-size:12px"><span style="font-weight:600">Admin</span><span style="color:#6a6a6a">Sign out</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dashboard&quot;,&quot;Universities&quot;,&quot;Import&quot;,&quot;New run&quot;,&quot;Review&quot;,&quot;Schedules&quot;,&quot;Export&quot;,&quot;Settings&quot;],&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Dashboard';
    const list = [
      { head: 'Overview', label: 'Dashboard' },
      { head: 'Data', label: 'Universities' },
      { label: 'Import' },
      { head: 'Runs', label: 'New run' },
      { label: 'Review', badge: '47' },
      { label: 'Schedules' },
      { head: 'Output', label: 'Export' },
      { head: 'System', label: 'Settings' },
    ];
    return {
      items: list.map(i => ({
        ...i, hasHead: !!i.head, hasBadge: !!i.badge,
        bg: i.label === a ? '#ebe6d6' : 'transparent',
        fw: i.label === a ? 600 : 500,
        fg: i.label === a ? '#0a0a0a' : '#3a3a3a',
      })),
    };
  }
}
</script>
</body>
</html>
